[linux_servers]
# Add servers here with their CROIT agent token
# Format: hostname ansible_host=IP croit_token=TOKEN
frm-r1rbwsortq ansible_user=wso2 ansible_ssh_private_key_file=~/.ssh/id_rsa croit_token=REPLACE_WITH_TOKEN

[linux_servers:vars]
ansible_connection=ssh
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
