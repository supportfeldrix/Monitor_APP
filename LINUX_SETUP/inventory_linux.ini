[linux_servers]
# Add servers here with their CROIT agent token
# Format: hostname ansible_host=IP croit_token=TOKEN
frm-r1rbwsortq ansible_user=wso2 ansible_ssh_private_key_file=~/.ssh/id_rsa croit_token=REPLACE_WITH_TOKEN

[linux_servers:vars]
ansible_connection=ssh
ansible_ssh_common_args='-o StrictHostKeyChecking=no'

# ═══════════════════════════════════════════════════════════════════════════════
# Fircosoft ACR (AlertController) process monitoring
# ═══════════════════════════════════════════════════════════════════════════════
# REFERENCE BLOCK — mirror this into the real inventory at
#   /home/ansible/CRO-IT/inventories/fircosoft.ini
# ONLY hosts in [fircosoft_acr] get Fircosoft process monitoring. The playbook
# passes croit_process_config to the collector as the CROIT_PROCESS_CONFIG env var.
# All other hosts default croit_process_config to empty and emit no process_services.
# Format per entry: name|pattern|ports|critical  —  entries separated by `;;`
[fircosoft_acr]
cro-r1fxacruat
cro-r3fxacruat
cro-rbfxacrdev

[fircosoft_acr:vars]
croit_process_config=AlertReview|tierName=AlertReview|6902,8443|true;;AlertController-Orchestrator|tierName=AlertControllerOrchestrator|6080,6081|true;;AlertController-CoreEngine|/opt/fircosoft/BackEnds/bin/AlertController/CoreEngine/FKRUN|6450,6500,6900|true;;AppDynamics-AppAgent|appdynamics|{EMPTY}|false
