# ============================================================
# CROIT Uptime Monitoring - Nginx Reverse Proxy Config
# Place in: /etc/nginx/conf.d/croit-monitor.conf
# External port: 9443 (already open on firewall)
# Internal port: 5000 (localhost only, not exposed)
# ============================================================

# Redirect HTTP port 9080 to HTTPS 9443 (optional)
server {
    listen 9080;
    server_name frm-rbautodev01;
    return 301 https://$host:9443$request_uri;
}

# HTTPS server on port 9443
server {
    listen 9443 ssl;
    server_name frm-rbautodev01;

    # SSL certificates (your existing FNB certs)
    ssl_certificate     /opt/croit-monitor/ssl/frm-rbautodev01.crt;
    ssl_certificate_key /opt/croit-monitor/ssl/frm-rbautodev01-nopass.key;

    # Modern SSL settings
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Logging
    access_log /opt/croit-monitor/logs/nginx-access.log;
    error_log  /opt/croit-monitor/logs/nginx-error.log;

    # Proxy all requests to Flask/Gunicorn on localhost:5000
    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;

        # Allow cookies for session management
        proxy_set_header   Cookie $http_cookie;
        proxy_pass_header  Set-Cookie;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|avif|ico|woff2)$ {
        proxy_pass http://127.0.0.1:5000;
        add_header Cache-Control "public, max-age=3600";
        proxy_cache_valid 200 1h;
    }
}
